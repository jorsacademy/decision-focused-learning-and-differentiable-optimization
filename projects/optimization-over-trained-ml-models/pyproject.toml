[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-over-trained-ml-models"
version = "0.1.0"
description = "Embed trained scikit-learn predictors into optimization models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
gurobi = ["gurobipy>=11", "gurobi-machinelearning>=1.5"]
omlt = ["pyomo>=6.8", "omlt>=1.2", "onnx>=1.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
