name: Trained ML Embedding

on:
  push:
    branches: [main]
    paths:
      - "projects/optimization-over-trained-ml-models/**"
      - ".github/workflows/trained-ml-embedding.yml"
  pull_request:
    paths:
      - "projects/optimization-over-trained-ml-models/**"
      - ".github/workflows/trained-ml-embedding.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: projects/optimization-over-trained-ml-models

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Benchmark smoke
        run: python scripts/run_benchmark.py
